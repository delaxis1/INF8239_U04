priority_harm: >-
  Que una persona del grupo G1 cuyo caso si requiere revision quede sin marcar y por
  tanto sin atencion. Elijo este dano por encima del sobre-marcado de G2 porque el
  sistema solo ordena una cola para revision humana: un falso positivo cuesta una
  revision de mas, que el operador descarta, mientras un falso negativo cuesta un caso
  desatendido que nadie vuelve a mirar. Los dos danos existen y son medibles, pero no se
  pueden minimizar a la vez con el mismo umbral, y este es el que elijo evitar primero.

primary_metric: >-
  Brecha de recall entre grupos protegidos, es decir la diferencia en la proporcion de
  casos que si requerian revision y el sistema efectivamente marco. Es la metrica que
  mide el dano elegido: la exactitud global lo esconde, porque un modelo puede acertar
  mas en total mientras desatiende sistematicamente a un grupo.

tolerance: >-
  0.16, el techo que configs/governance.yml ya declaraba antes de auditar. Lo mantengo
  sin cambios precisamente porque medi 0.138 despues: bajarlo ahora para reprobar al
  modelo, o subirlo para aprobarlo, seria mover la porteria una vez visto el resultado.
  El margen es estrecho, 0.022, y eso queda escrito como parte de la decision y no como
  un detalle al margen.

evidence: >-
  reports/lab12/logistic/ y reports/lab12/tree/, generados por scripts/lab12_audit.py
  sobre los 160 casos de prueba de la particion cronologica del 25 de septiembre al 27
  de diciembre de 2026. Regresion logistica: recall 0.653 en G1 frente a 0.791 en G2,
  brecha 0.138; FPR 0.250 frente a 0.375, brecha 0.125; tasa de seleccion 0.446 frente a
  0.678; 0.014 ms por caso y 3.56 KB. Pasa las cinco compuertas. Arbol de decision:
  brecha de recall 0.181 y brecha de FPR 0.168, ambas por encima del techo de 0.16, y
  exactitud menor, 0.706 frente a 0.719; estado REVIEW. Ninguna cifra esta escrita a
  mano: todas salen de ejecutar el script. Lineas base en reports/lab12/comparison.csv,
  generadas por scripts/compare_alternatives.py: la regla manual no predictiva alcanza
  recall 0.837 global y 0.898 en G1, con FPR 0.544 y el 71.3 por ciento de casos marcados;
  marcar_todo obtiene recall 1.0 y brechas 0.0, de modo que pasa las cinco compuertas.

limitation: >-
  Cuatro limites. Primero y el mas importante: la alternativa no predictiva atiende mejor
  al grupo que elegi proteger. La regla manual logra recall 0.898 en G1 frente a 0.653 del
  modelo, con brecha de recall 0.131 frente a 0.138. Para el dano prioritario el modelo es
  peor que no usar modelo, y su unica ventaja es marcar el 53 por ciento de los casos en
  lugar del 71 por ciento. Segundo, las compuertas de configs/governance.yml aprueban la
  regla trivial de marcar a todo el mundo: recall 1.0 y brechas 0.0, porque fijan un recall
  minimo y brechas maximas pero no acotan FPR ni precision. El marco de gobernanza tiene un
  hueco y lo declaro. Tercero, el desglose interseccional no es interpretable en tres de
  ocho celdas: G2 con 30-44 y G2 con 45-59 tienen 2 casos negativos, y G2 con 18-29 tiene 3,
  de modo que el FPR de 1.000 que aparece en el arbol son dos casos de dos; declaro soporte
  minimo de 30 casos y no concluyo nada por debajo. Cuarto, la brecha de 0.138 viene de una
  sola particion de 160 casos, sin intervalo de confianza ni repeticion con otras semillas,
  y los datos son sinteticos: nada de esto estima el comportamiento sobre poblacion real.

recommendation: >-
  LIMITAR, en los terminos del mandato: ni desplegar sin condiciones ni descartar. El
  modelo logistico solo se justifica si la capacidad de revision es el limite real de la
  institucion, porque es lo unico que compra: baja del 71 al 53 por ciento de casos
  marcados y casi reduce a la mitad los falsos positivos, a cambio de 12 puntos menos de
  recall en G1. Si la capacidad de revision no es el cuello de botella, la decision correcta
  es NO UTILIZAR el modelo y quedarse con la regla manual, que atiende mejor al grupo que
  elegi proteger y no necesita datos sensibles ni modelo alguno. Esa condicion la debe
  declarar por escrito el responsable institucional antes de cualquier despliegue.
  Entre los dos modelos recomiendo la logistica y descarto el arbol, que viola dos
  compuertas de equidad, 0.181 y 0.168, siendo ademas menos exacto.
  El uso limitado queda condicionado a cinco cosas: revision humana obligatoria de cada
  caso marcado, sin accion automatica; anadir a governance.yml una compuerta de FPR maximo
  y precision minima, porque sin ellas el marco aprueba marcar a todo el mundo; reauditoria
  mensual de la brecha de recall con retiro inmediato si supera 0.16 o si el recall global
  baja de 0.68; publicacion de la auditoria completa con las celdas sin soporte marcadas
  como tales; y mecanismo de apelacion operativo antes del primer caso real.